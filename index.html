
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="TradeEdge — Track your trades. Find your edge.">
<title>TradeEdge</title>
<style>
:root{
  --bg:#090c11;--panel:#0f141b;--panel2:#121923;--line:#202a36;--text:#e8edf4;
  --muted:#788697;--muted2:#5f6d7c;--accent:#e9eef4;--green:#9ed5b7;--red:#e1a7ab;
  --yellow:#d8c48a;--blue:#91b7dd;--shadow:0 12px 40px rgba(0,0,0,.18)
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
aside{position:fixed;inset:0 auto 0 0;width:246px;background:#0c1016;border-right:1px solid var(--line);padding:22px 15px;z-index:10}
.brand{display:flex;gap:11px;align-items:center;padding:3px 8px 24px}
.logo{width:36px;height:36px;border:1px solid #3a4655;border-radius:10px;display:grid;place-items:center;font-weight:850;letter-spacing:-.05em}
.brand b{display:block;font-size:15px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.nav{display:grid;gap:4px}
.nav button{border:1px solid transparent;background:transparent;color:#8d99a8;padding:11px;border-radius:9px;text-align:left}
.nav button:hover,.nav button.active{background:#171e28;color:#fff;border-color:#202a36}
.privacy{position:absolute;left:15px;right:15px;bottom:18px;border:1px solid #242e3a;background:#0d131b;border-radius:10px;padding:12px;color:#788696;font-size:10px;line-height:1.45}
.privacy b{display:block;color:#c9d2dd;margin-bottom:3px}
main{margin-left:246px;min-height:100vh;padding:30px 38px;max-width:1550px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:25px}
.eyebrow{font-size:9px;letter-spacing:.16em;color:#687687;font-weight:850}
h1{font-size:29px;line-height:1;margin:6px 0 0;letter-spacing:-.035em}
h2{font-size:20px;margin:0 0 7px;letter-spacing:-.02em}h3{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#8b98a8;margin:25px 0 11px}
.grid{display:grid;gap:13px}.stats{grid-template-columns:repeat(6,minmax(0,1fr))}
.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}
.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.stat{padding:15px}.stat span,.muted{color:var(--muted);font-size:10px}.stat strong{display:block;font-size:21px;margin-top:8px;letter-spacing:-.02em}
.card{padding:17px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.head b{font-size:13px}
.pos{color:var(--green)!important}.neg{color:var(--red)!important}.warn{color:var(--yellow)!important}.blue{color:var(--blue)!important}
.btn{border:1px solid #2a3542;background:#151c25;color:#cfd7e1;padding:9px 12px;border-radius:8px}
.btn:hover{background:#1a232e}.btn.primary{background:#edf1f5;color:#0a0d12;border-color:#edf1f5;font-weight:800}.btn.danger{color:var(--red)}
.btn.small{padding:6px 9px;font-size:11px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:13px}
.input,.select,.textarea{background:#0c1219;border:1px solid #293441;color:#dfe6ee;border-radius:8px;padding:9px;outline:0}
.input:focus,.select:focus,.textarea:focus{border-color:#536477}
.toolbar .input{flex:1;min-width:220px}
.chart{min-height:290px}.chart svg{width:100%;height:235px;display:block}.chart .emptychart{height:235px;display:grid;place-items:center;color:var(--muted)}
.chart-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:2px}
.row{display:flex;align-items:center;gap:10px;border-top:1px solid #1b242f;padding:11px 0}.row:first-child{border-top:0}.grow{flex:1}.row b{font-size:12px}.row small{display:block;color:var(--muted2);font-size:9px;margin-top:3px}
.dot{width:28px;height:28px;border-radius:8px;background:#18212c;display:grid;place-items:center;font-size:10px;font-weight:800}
.table-wrap{overflow:auto}.table{width:100%;min-width:850px;border-collapse:collapse;font-size:11px}.table th{text-align:left;color:#667383;font-size:9px;text-transform:uppercase;padding:11px;background:#0c1117;position:sticky;top:0}.table td{padding:11px;border-top:1px solid #1d2631;color:#b2bdc9;white-space:nowrap}
.pill{font-size:9px;padding:4px 7px;border-radius:20px}.long{background:#123024;color:#9ed2b5}.short{background:#32191b;color:#dda5a8}
.empty{text-align:center;padding:35px;color:#778494}.empty b{display:block;color:#b8c2ce;margin-bottom:5px}
.welcome{margin-top:13px;display:flex;justify-content:space-between;gap:20px;align-items:center}.welcome p{color:#7e8998;max-width:720px;line-height:1.65;font-size:12px;margin:7px 0}
.form{max-width:1150px}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field{display:grid;gap:5px}.field>span{color:#7f8b9a;font-size:10px}.textarea{min-height:80px;width:100%;resize:vertical}.wide{grid-column:1/-1}
.metrics{display:flex;gap:16px;flex-wrap:wrap;background:#0b1016;border:1px solid #202a35;border-radius:9px;padding:11px;margin:12px 0}.metrics span{color:#697686;font-size:9px}.metrics b{display:block;color:#d7dfe8;font-size:12px;margin-top:3px}
.screens{display:grid;grid-template-columns:1fr 1fr;gap:12px}.screen{min-height:190px;border:1px dashed #34404e;border-radius:10px;display:grid;place-items:center;position:relative;overflow:hidden;color:#758294;background:#0c1117}.screen label{position:absolute;top:10px;left:12px;font-size:10px;color:#aab5c2}.screen input{position:absolute;inset:0;opacity:0;cursor:pointer}.screen img{max-width:100%;max-height:290px;object-fit:contain}
.break{display:grid;grid-template-columns:170px 1fr 75px;gap:10px;align-items:center;border-top:1px solid #1b232d;padding:11px 0}.break:first-child{border-top:0}.break small{display:block;color:#697687;font-size:9px;margin-top:3px}.bar{height:5px;background:#1a222c;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:#8496a8}.insights{grid-template-columns:repeat(3,1fr)}
.setting{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:14px 0;border-top:1px solid #1c242e}.setting small{display:block;color:#718092;font-size:10px;margin-top:4px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.demo-banner{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 16px;margin-top:13px;border:1px solid #2a3441;background:#101720;border-radius:11px}
.demo-banner p{margin:3px 0 0;color:var(--muted);font-size:11px;line-height:1.5}
.kicker{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:13px}
.quick{padding:13px;border:1px solid #202a36;background:#0e141b;border-radius:10px}
.quick b{display:block;font-size:12px}.quick span{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;z-index:50;padding:20px}.modal{max-width:520px;width:100%;background:#111821;border:1px solid #2a3441;border-radius:13px;padding:22px}.modal p{color:#8995a4;font-size:12px;line-height:1.6}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
@media(max-width:1150px){.stats{grid-template-columns:repeat(3,1fr)}.two,.three,.insights{grid-template-columns:1fr}.quick-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){aside{position:static;width:100%;height:auto;padding:14px}.app{display:block}main{margin:0;padding:18px}.nav{grid-template-columns:repeat(5,1fr)}.nav button{font-size:0;text-align:center;padding:10px 5px}.nav button:first-letter{font-size:16px}.privacy{display:none}.stats{grid-template-columns:repeat(2,1fr)}.formgrid,.screens{grid-template-columns:1fr}.quick-grid{grid-template-columns:1fr 1fr}header{align-items:center}.welcome,.demo-banner{display:block}.demo-banner .btn{margin-top:10px}.break{grid-template-columns:120px 1fr 58px}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand">
    <span class="logo">T</span>
    <div><b>TradeEdge</b><small>Track your trades. Find your edge.</small></div>
  </div>
  <div class="nav" id="nav"></div>
  <div class="privacy"><b>Privacy first</b>Your journal stays in this browser. No account or server required.</div>
</aside>
<main>
<header>
  <div><div class="eyebrow">PERSONAL TRADING PERFORMANCE LAB</div><h1 id="title">Dashboard</h1></div>
  <button class="btn primary" onclick="show('add')">＋ Add Trade</button>
</header>
<div id="content"></div>
</main>
</div>

<script>
const ASSETS=['Forex','Gold','Crypto','Stock CFD','Index CFD'];
const STRATEGIES=['Liquidity Sweep','Breakout','Break & Retest','Support/Resistance','Trend Continuation','Reversal','Pullback','Momentum','Mean Reversion','Other'];
const SESSIONS=['Asian','London','New York','London/NY Overlap','Other'];
const EMOTIONS=['Calm','Confident','Excited','Fearful','FOMO','Angry','Hesitant','Revenge','Neutral'];
const MISTAKES=['Early entry','Late entry','Oversized position','Moved SL','Removed SL','Chased trade','Revenge trade','Overtrading','Ignored setup','Low-quality setup','Exited early','Held too long','Other'];
let trades=[], editing=null, db=null, filter={asset:'All',strategy:'All',result:'All',q:''};
const $=id=>document.getElementById(id);
const n=v=>Number(v||0);
const uid=()=>crypto.randomUUID ? crypto.randomUUID() : 't_'+Date.now()+'_'+Math.random().toString(36).slice(2);

function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open('tradeedge',1);
    req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('trades'))req.result.createObjectStore('trades',{keyPath:'id'});};
    req.onsuccess=()=>{db=req.result;resolve(db)};
    req.onerror=()=>reject(req.error);
  });
}
async function allTrades(){
  if(!db) await openDB();
  return new Promise((resolve,reject)=>{
    const req=db.transaction('trades','readonly').objectStore('trades').getAll();
    req.onsuccess=()=>resolve(req.result||[]); req.onerror=()=>reject(req.error);
  });
}
async function putTrade(t){
  if(!db) await openDB();
  return new Promise((resolve,reject)=>{
    const req=db.transaction('trades','readwrite').objectStore('trades').put(t);
    req.onsuccess=()=>resolve(); req.onerror=()=>reject(req.error);
  });
}
async function deleteTrade(id){
  if(!confirm('Delete this trade?')) return;
  await new Promise((resolve,reject)=>{
    const req=db.transaction('trades','readwrite').objectStore('trades').delete(id);
    req.onsuccess=()=>resolve(); req.onerror=()=>reject(req.error);
  });
  await load();
}
async function clearAll(){
  if(!confirm('Delete all TradeEdge data from this browser? This cannot be undone.')) return;
  await new Promise((resolve,reject)=>{
    const req=db.transaction('trades','readwrite').objectStore('trades').clear();
    req.onsuccess=()=>resolve(); req.onerror=()=>reject(req.error);
  });
  await load(); show('dashboard');
}
function calc(t){
  const entry=n(t.entry), sl=n(t.stopLoss), tp=n(t.takeProfit), exit=n(t.exit), size=n(t.positionSize), contract=n(t.contractSize||1);
  const priceRisk=Math.abs(entry-sl);
  const risk=priceRisk*size*contract;
  const plannedReward=Math.abs(tp-entry)*size*contract;
  const rr=risk?plannedReward/risk:0;
  const gross=(exit-entry)*size*contract*(t.direction==='Short'?-1:1);
  const pnl=gross-n(t.commission)-n(t.swap)-n(t.fees);
  return {risk,rr,pnl,r:risk?pnl/risk:0,gross};
}
function rows(){
  return trades.filter(t=>{
    const c=calc(t);
    const result=filter.result==='All'||(filter.result==='Win'?c.pnl>0:filter.result==='Loss'?c.pnl<0:c.pnl===0);
    return (filter.asset==='All'||t.assetClass===filter.asset)
      &&(filter.strategy==='All'||t.strategy===filter.strategy)
      &&result
      &&(`${t.instrument||''} ${t.strategy||''} ${t.notes||''}`.toLowerCase().includes(filter.q.toLowerCase()));
  });
}
function stats(ts){
  let pnl=0,r=0,w=0,l=0,gw=0,gl=0,peak=0,dd=0,streak=0,bestStreak=0,lossStreak=0,bestLoss=0;
  [...ts].sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(t=>{
    const c=calc(t); pnl+=c.pnl; r+=c.r; peak=Math.max(peak,pnl); dd=Math.max(dd,peak-pnl);
    if(c.pnl>0){w++;gw+=c.pnl;streak=Math.max(1,streak+1);bestStreak=Math.max(bestStreak,streak);lossStreak=0}
    else if(c.pnl<0){l++;gl+=Math.abs(c.pnl);streak=0;lossStreak=Math.max(1,lossStreak+1);bestLoss=Math.max(bestLoss,lossStreak)}
  });
  const total=w+l;
  return {pnl,r,w,l,pf:gl?gw/gl:0,expectancy:total?r/total:0,dd,winRate:total?100*w/total:0,bestStreak,bestLoss};
}
function nav(){
  const items=[['dashboard','⌂','Dashboard'],['journal','▤','Journal'],['analytics','◈','Analytics'],['insights','✦','Insights'],['settings','⚙','Settings']];
  const current=location.hash.slice(1)||'dashboard';
  $('nav').innerHTML=items.map(x=>`<button class="${current===x[0]?'active':''}" onclick="show('${x[0]}')">${x[1]} ${x[2]}</button>`).join('');
}
function show(page){
  if(location.hash.slice(1)!==page) location.hash=page;
  editing=null; nav(); $('title').textContent=page==='add'?'Add Trade':page[0].toUpperCase()+page.slice(1); render(page);
}
function render(page){
  if(page==='dashboard') dashboard();
  else if(page==='journal') journal();
  else if(page==='add') form();
  else if(page==='analytics') analytics();
  else if(page==='insights') insights();
  else if(page==='settings') settings();
  else dashboard();
}
async function load(){
  trades=await allTrades();
  render(location.hash.slice(1)||'dashboard');
  nav();
}
function money(v){return `${v>=0?'+':''}$${v.toFixed(2)}`}
function cardStats(s){
  const cards=[
    ['Total P&L',money(s.pnl),s.pnl>=0?'pos':'neg'],
    ['Win Rate',`${s.winRate.toFixed(1)}%`, ''],
    ['Profit Factor',s.pf.toFixed(2),''],
    ['Expectancy',`${s.expectancy>=0?'+':''}${s.expectancy.toFixed(2)}R`,s.expectancy>=0?'pos':'neg'],
    ['Max Drawdown',`$${s.dd.toFixed(2)}`,s.dd?'neg':''],
    ['Trades',String(s.w+s.l),'']
  ];
  return `<div class="grid stats">${cards.map(c=>`<div class="stat"><span>${c[0]}</span><strong class="${c[2]}">${c[1]}</strong></div>`).join('')}</div>`;
}
function equityChart(ts){
  if(!ts.length)return `<div class="emptychart">Add trades or load demo data to see your equity curve.</div>`;
  const sorted=[...ts].sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  let v=0, pts=sorted.map((t,i)=>{v+=calc(t).pnl;return [i,v]});
  const w=800,h=210,pad=20,vals=pts.map(x=>x[1]),min=Math.min(0,...vals),max=Math.max(0,...vals),range=max-min||1;
  const xy=pts.map(([i,val])=>`${pad+i*((w-pad*2)/Math.max(1,pts.length-1))},${h-pad-(val-min)/(range)*(h-pad*2)}`).join(' ');
  const zeroY=h-pad-(0-min)/range*(h-pad*2);
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <line x1="${pad}" y1="${zeroY}" x2="${w-pad}" y2="${zeroY}" stroke="#27323e" stroke-dasharray="4 5"/>
    <polyline fill="none" stroke="#b6c3d0" stroke-width="2.5" points="${xy}"/>
    ${pts.length>1?`<circle cx="${pts.at(-1)[0]*(w-pad*2)/Math.max(1,pts.length-1)+pad}" cy="${h-pad-(pts.at(-1)[1]-min)/range*(h-pad*2)}" r="4" fill="#e9eef4"/>`:''}
  </svg><div class="chart-meta"><span>Start $0</span><span>Current ${money(vals.at(-1))}</span></div>`;
}
function dashboard(){
  const ts=rows(), s=stats(ts);
  $('content').innerHTML=cardStats(s)+`
    <div class="grid two" style="margin-top:13px">
      <div class="card chart"><div class="head"><b>Equity Curve</b><span class="muted">${ts.length} trades</span></div>${equityChart(ts)}</div>
      <div class="card"><div class="head"><b>Quick Performance</b><span class="muted">Current filter</span></div>
        <div class="row"><div class="dot">R</div><div class="grow"><b>Cumulative R</b><small>Total return measured in risk units</small></div><strong class="${s.r>=0?'pos':'neg'}">${s.r>=0?'+':''}${s.r.toFixed(2)}R</strong></div>
        <div class="row"><div class="dot">W</div><div class="grow"><b>Winning trades</b><small>Closed trades with positive P&L</small></div><strong>${s.w}</strong></div>
        <div class="row"><div class="dot">L</div><div class="grow"><b>Losing trades</b><small>Closed trades with negative P&L</small></div><strong>${s.l}</strong></div>
        <div class="row"><div class="dot">S</div><div class="grow"><b>Best win streak</b><small>Consecutive profitable trades</small></div><strong>${s.bestStreak}</strong></div>
        <div class="row"><div class="dot">D</div><div class="grow"><b>Drawdown</b><small>Peak-to-trough P&L decline</small></div><strong class="${s.dd?'neg':''}">$${s.dd.toFixed(2)}</strong></div>
      </div>
    </div>
    ${ts.length?`<div class="demo-banner"><div><div class="kicker">Dashboard filter</div><p>Showing ${ts.length} trade${ts.length===1?'':'s'}. Use Journal filters for deeper slices of your data.</p></div><button class="btn" onclick="show('journal')">View Journal →</button></div>`:
    `<div class="demo-banner"><div><b>No trades yet</b><p>Start with your own trade or load a safe set of sample trades to explore TradeEdge.</p></div><button class="btn" onclick="loadDemo()">Explore Demo Data</button></div>`}
    <div class="quick-grid">
      <div class="quick"><span>Journal</span><b>Record every decision</b></div>
      <div class="quick"><span>Analytics</span><b>Find your strongest setups</b></div>
      <div class="quick"><span>Insights</span><b>Spot behavior patterns</b></div>
      <div class="quick"><span>Privacy</span><b>Data stays in this browser</b></div>
    </div>`;
}
function selectOptions(arr,current='All',includeAll=false){
  return (includeAll?['All',...arr]:arr).map(x=>`<option ${x===current?'selected':''}>${x}</option>`).join('');
}
function journal(){
  const ts=rows();
  $('content').innerHTML=`
  <div class="toolbar">
    <input class="input" placeholder="Search instrument, strategy or notes…" value="${esc(filter.q)}" oninput="filter.q=this.value;journal()">
    <select class="select" onchange="filter.asset=this.value;journal()">${selectOptions(ASSETS,filter.asset,true)}</select>
    <select class="select" onchange="filter.strategy=this.value;journal()">${selectOptions(STRATEGIES,filter.strategy,true)}</select>
    <select class="select" onchange="filter.result=this.value;journal()"><option ${filter.result==='All'?'selected':''}>All</option><option ${filter.result==='Win'?'selected':''}>Win</option><option ${filter.result==='Loss'?'selected':''}>Loss</option></select>
    <button class="btn primary" onclick="show('add')">＋ Add Trade</button>
  </div>
  <div class="card table-wrap">
    ${ts.length?`<table class="table"><thead><tr><th>Date</th><th>Instrument</th><th>Side</th><th>Strategy</th><th>Session</th><th>R</th><th>P&L</th><th>Quality</th><th></th></tr></thead><tbody>
    ${[...ts].sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(t=>{const c=calc(t);return `<tr>
      <td>${formatDate(t.date)}</td><td><b>${esc(t.instrument||'—')}</b><br><small>${esc(t.assetClass||'')}</small></td>
      <td><span class="pill ${t.direction==='Long'?'long':'short'}">${t.direction}</span></td><td>${esc(t.strategy||'—')}</td><td>${esc(t.session||'—')}</td>
      <td class="${c.r>=0?'pos':'neg'}"><b>${c.r>=0?'+':''}${c.r.toFixed(2)}R</b></td><td class="${c.pnl>=0?'pos':'neg'}"><b>${money(c.pnl)}</b></td>
      <td>${esc(t.setupQuality||'—')}</td><td><button class="btn small" onclick="editTrade('${t.id}')">Edit</button> <button class="btn small danger" onclick="deleteTrade('${t.id}')">Delete</button></td>
    </tr>`}).join('')}</tbody></table>`:`<div class="empty"><b>Your journal is empty.</b>Add your first trade or explore the demo dataset.</div>`}
  </div>`;
}
function field(key,label,type='text',value='',options=''){
  if(type==='select')return `<label class="field"><span>${label}</span><select class="select" id="f_${key}">${options}</select></label>`;
  if(type==='textarea')return `<label class="field wide"><span>${label}</span><textarea class="textarea" id="f_${key}">${esc(value||'')}</textarea></label>`;
  return `<label class="field"><span>${label}</span><input class="input" id="f_${key}" type="${type}" value="${esc(value??'')}"></label>`;
}
function form(){
  const t=editing||{id:uid(),date:new Date().toISOString().slice(0,16),assetClass:'Gold',direction:'Long',account:'Personal',timeframe:'5m',session:'London',strategy:'Liquidity Sweep',setupQuality:'A',confidence:7,marketCondition:'Trending',emotionBefore:'Calm',emotionDuring:'Calm',emotionAfter:'Neutral',ruleAdherence:'Yes',mistake:'None',positionSize:1,contractSize:1,commission:0,swap:0,fees:0};
  $('content').innerHTML=`
  <div class="card form">
    <div class="head"><div><div class="eyebrow">JOURNAL ENTRY</div><h2>${editing?'Edit Trade':'Record Trade'}</h2></div><span class="muted">All calculations update as you type.</span></div>
    <div class="metrics" id="metrics"></div>
    <h3>Trade Information</h3>
    <div class="formgrid">
      ${field('date','Date & time','datetime-local',t.date)}${field('instrument','Instrument','text',t.instrument||'')}
      ${field('assetClass','Asset class','select','',selectOptions(ASSETS,t.assetClass))}${field('direction','Direction','select','',selectOptions(['Long','Short'],t.direction))}
      ${field('account','Account','text',t.account||'Personal')}${field('timeframe','Timeframe','text',t.timeframe||'5m')}
      ${field('session','Session','select','',selectOptions(SESSIONS,t.session))}
    </div>
    <h3>Entry & Exit</h3>
    <div class="formgrid">
      ${field('entry','Entry price','number',t.entry)}${field('stopLoss','Stop loss','number',t.stopLoss)}${field('takeProfit','Take profit','number',t.takeProfit)}
      ${field('exit','Exit price','number',t.exit)}${field('positionSize','Position size','number',t.positionSize)}${field('contractSize','Contract size','number',t.contractSize||1)}
      ${field('commission','Commission','number',t.commission||0)}${field('swap','Swap','number',t.swap||0)}${field('fees','Other fees','number',t.fees||0)}
    </div>
    <h3>Setup & Psychology</h3>
    <div class="formgrid">
      ${field('strategy','Strategy','select','',selectOptions(STRATEGIES,t.strategy))}
      ${field('setupQuality','Setup quality','select','',selectOptions(['A+','A','B','C'],t.setupQuality))}
      ${field('confidence','Confidence (1–10)','number',t.confidence||7)}
      ${field('marketCondition','Market condition','select','',selectOptions(['Trending','Ranging','Volatile','Choppy'],t.marketCondition))}
      ${field('emotionBefore','Emotion before','select','',selectOptions(EMOTIONS,t.emotionBefore))}
      ${field('emotionDuring','Emotion during','select','',selectOptions(EMOTIONS,t.emotionDuring))}
      ${field('emotionAfter','Emotion after','select','',selectOptions(EMOTIONS,t.emotionAfter))}
      ${field('ruleAdherence','Rule adherence','select','',selectOptions(['Yes','Partially','No'],t.ruleAdherence))}
      ${field('mistake','Mistake','select','',selectOptions(['None',...MISTAKES],t.mistake))}
      ${field('entryReason','Entry reason','textarea',t.entryReason||'')}
      ${field('exitReason','Exit reason','textarea',t.exitReason||'')}
      ${field('notes','Notes','textarea',t.notes||'')}
    </div>
    <h3>Chart Screenshots</h3>
    <div class="screens">
      <div class="screen" id="beforeBox"><label>Before trade</label><span>＋ Click to upload chart image</span><input type="file" accept="image/*" onchange="image(this,'beforeBox')"></div>
      <div class="screen" id="afterBox"><label>After trade</label><span>＋ Click to upload result image</span><input type="file" accept="image/*" onchange="image(this,'afterBox')"></div>
    </div>
    <div class="actions"><button class="btn" onclick="show('journal')">Cancel</button><button class="btn primary" onclick="saveForm()">Save Trade</button></div>
  </div>`;
  window._image={before:t.beforeImage||'',after:t.afterImage||''};
  if(window._image.before)preview('beforeBox',window._image.before);
  if(window._image.after)preview('afterBox',window._image.after);
  ['entry','stopLoss','takeProfit','exit','positionSize','contractSize','commission','swap','fees','direction'].forEach(k=>$('f_'+k).addEventListener('input',metrics));
  metrics();
}
function metrics(){
  const t={entry:$('f_entry')?.value,stopLoss:$('f_stopLoss')?.value,takeProfit:$('f_takeProfit')?.value,exit:$('f_exit')?.value,positionSize:$('f_positionSize')?.value,contractSize:$('f_contractSize')?.value,commission:$('f_commission')?.value,swap:$('f_swap')?.value,fees:$('f_fees')?.value,direction:$('f_direction')?.value};
  const c=calc(t);
  $('metrics').innerHTML=`<span>Risk<b>$${c.risk.toFixed(2)}</b></span><span>Planned R:R<b>${c.rr.toFixed(2)}</b></span><span>Actual R<b class="${c.r>=0?'pos':'neg'}">${c.r>=0?'+':''}${c.r.toFixed(2)}R</b></span><span>P&L<b class="${c.pnl>=0?'pos':'neg'}">${money(c.pnl)}</b></span>`;
}
function image(input,box){
  const file=input.files&&input.files[0]; if(!file)return;
  if(file.size>4*1024*1024){alert('Please use an image under 4 MB.');return;}
  const reader=new FileReader();
  reader.onload=()=>{window._image[box==='beforeBox'?'before':'after']=reader.result;preview(box,reader.result)};
  reader.readAsDataURL(file);
}
function preview(box,src){
  $(box).innerHTML=`<label>${box==='beforeBox'?'Before trade':'After trade'}</label><img src="${src}" alt="Trade chart"><input type="file" accept="image/*" onchange="image(this,'${box}')">`;
}
async function saveForm(){
  const t=editing||{id:uid()};
  const keys=['date','instrument','assetClass','direction','account','timeframe','session','entry','stopLoss','takeProfit','exit','positionSize','contractSize','commission','swap','fees','strategy','setupQuality','confidence','marketCondition','emotionBefore','emotionDuring','emotionAfter','ruleAdherence','mistake','entryReason','exitReason','notes'];
  keys.forEach(k=>{const el=$('f_'+k);if(el)t[k]=el.value});
  t.confidence=Math.max(1,Math.min(10,n(t.confidence)));
  t.positionSize=n(t.positionSize);t.contractSize=n(t.contractSize)||1;t.commission=n(t.commission);t.swap=n(t.swap);t.fees=n(t.fees);
  t.beforeImage=window._image.before||'';t.afterImage=window._image.after||'';
  await putTrade(t); editing=null; await load(); show('journal');
}
function editTrade(id){editing=trades.find(t=>t.id===id)||null;show('add')}
function group(key){
  const m={};
  rows().forEach(t=>{
    const k=t[key]||'Unknown',c=calc(t);
    m[k]??={n:0,r:0,p:0,w:0};
    m[k].n++;m[k].r+=c.r;m[k].p+=c.pnl;if(c.pnl>0)m[k].w++;
  });
  return Object.entries(m).sort((a,b)=>b[1].r-a[1].r);
}
function breakdown(title,data){
  return `<div class="card"><div class="head"><b>${title}</b><span class="muted">Performance breakdown</span></div>${
    data.length?data.map(([k,v])=>`<div class="break"><div><b>${esc(k)}</b><small>${v.n} trades · ${(100*v.w/v.n).toFixed(0)}% win</small></div><div class="bar"><i style="width:${Math.min(100,Math.abs(v.r)*8)}%"></i></div><strong class="${v.r>=0?'pos':'neg'}">${v.r>=0?'+':''}${v.r.toFixed(2)}R</strong></div>`).join(''):'<div class="empty">No data yet.</div>'}</div>`;
}
function analytics(){
  $('content').innerHTML=`<div class="grid two">${breakdown('By Strategy',group('strategy'))}${breakdown('By Instrument',group('instrument'))}</div>
  <div class="grid two" style="margin-top:13px">${breakdown('By Session',group('session'))}${breakdown('By Timeframe',group('timeframe'))}</div>
  <div class="grid two" style="margin-top:13px">${breakdown('By Direction',group('direction'))}${breakdown('By Setup Quality',group('setupQuality'))}</div>
  <div class="grid two" style="margin-top:13px">${breakdown('By Rule Adherence',group('ruleAdherence'))}${breakdown('By Emotion Before',group('emotionBefore'))}</div>`;
}
function insights(){
  const s=group('strategy'), m=group('mistake').filter(x=>x[0]!=='None'), e=group('emotionBefore'), q=group('setupQuality');
  const best=s[0], worstMistake=m.sort((a,b)=>a[1].r-b[1].r)[0], bestEmotion=e.sort((a,b)=>b[1].r-a[1].r)[0], bestQuality=q[0];
  $('content').innerHTML=`<div class="grid insights">
    <div class="card"><b>✦ Your edge</b><p class="muted">${best?`${esc(best[0])} is currently your strongest setup at ${best[1].r>=0?'+':''}${best[1].r.toFixed(2)}R across ${best[1].n} trades.`:'Add more trades to discover your strongest setup.'}</p></div>
    <div class="card"><b>⚠ Performance leak</b><p class="muted">${worstMistake?`${esc(worstMistake[0])} is associated with ${worstMistake[1].r>=0?'+':''}${worstMistake[1].r.toFixed(2)}R. Review these trades before repeating the pattern.`:'No recurring mistake detected yet.'}</p></div>
    <div class="card"><b>◉ Psychology</b><p class="muted">${bestEmotion?`${esc(bestEmotion[0])} trades currently have the strongest result at ${bestEmotion[1].r>=0?'+':''}${bestEmotion[1].r.toFixed(2)}R.`:'Record emotions to unlock behavioral insights.'}</p></div>
  </div>
  <div class="grid two" style="margin-top:13px">
    <div class="card"><b>Setup quality</b><p class="muted">${bestQuality?`${esc(bestQuality[0])} setups have ${bestQuality[1].w}/${bestQuality[1].n} wins and ${bestQuality[1].r>=0?'+':''}${bestQuality[1].r.toFixed(2)}R.`:'No setup-quality data yet.'}</p></div>
    <div class="card"><b>Methodology</b><p class="muted">Insights are descriptive statistics from your own journal. They are not predictions, signals or financial advice.</p></div>
  </div>`;
}
function settings(){
  $('content').innerHTML=`<div class="grid two">
    <div class="card"><div class="head"><b>Backup & Export</b><span class="muted">Local-first</span></div>
      <div class="setting"><div><b>JSON backup</b><small>Full journal including screenshots.</small></div><button class="btn" onclick="exportJSON()">Export JSON</button></div>
      <div class="setting"><div><b>CSV export</b><small>Trade data for spreadsheets.</small></div><button class="btn" onclick="exportCSV()">Export CSV</button></div>
      <div class="setting"><div><b>Import JSON</b><small>Restore a TradeEdge backup.</small></div><input type="file" accept="application/json" onchange="importJSON(this)"></div>
    </div>
    <div class="card"><div class="head"><b>Privacy</b><span class="muted">No account required</span></div><p class="muted" style="line-height:1.7">TradeEdge stores journal data in this browser's IndexedDB. Nothing is sent to a TradeEdge server. Export a backup before clearing browser/site data.</p><button class="btn danger" onclick="clearAll()">Delete all local data</button></div>
  </div>
  <div class="card" style="margin-top:13px"><div class="head"><b>Demo data</b><span class="muted">For exploring the product</span></div><p class="muted">Demo trades are stored locally just like real trades. You can delete them individually or clear all local data.</p><button class="btn" onclick="loadDemo()">Load demo dataset</button></div>`;
}
function download(blob,name){
  const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500);
}
function exportJSON(){download(new Blob([JSON.stringify({app:'TradeEdge',version:'1.1',exportedAt:new Date().toISOString(),trades},null,2)],{type:'application/json'}),'tradeedge-backup.json')}
function exportCSV(){
  const h=['date','instrument','assetClass','direction','account','timeframe','session','entry','stopLoss','takeProfit','exit','positionSize','contractSize','commission','swap','fees','strategy','setupQuality','confidence','marketCondition','emotionBefore','emotionDuring','emotionAfter','ruleAdherence','mistake','entryReason','exitReason','notes'];
  const lines=[h.join(','),...trades.map(t=>h.map(k=>`"${String(t[k]??'').replaceAll('"','""')}"`).join(','))];
  download(new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'}),'tradeedge-trades.csv');
}
function importJSON(input){
  const file=input.files&&input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=async()=>{
    try{
      const data=JSON.parse(reader.result);if(!Array.isArray(data.trades))throw new Error('Invalid backup');
      for(const t of data.trades){if(t&&t.id)await putTrade(t)}
      await load();alert(`Imported ${data.trades.length} trade${data.trades.length===1?'':'s'}.`);
    }catch(e){alert('Invalid TradeEdge JSON backup.')}
  };
  reader.readAsText(file);
}
function demoTrade(days,x){
  const long=x[2]==='Long', r=x[4];
  return {id:uid(),date:new Date(Date.now()-days*86400000).toISOString().slice(0,16),instrument:x[0],assetClass:x[1],direction:x[2],strategy:x[3],timeframe:x[6]||'5m',session:x[7]||'London',account:'Demo',entry:100,stopLoss:long?99:101,takeProfit:long?102:98,exit:long?100+r/2:100-r/2,positionSize:1,contractSize:1,commission:0,swap:0,fees:0,setupQuality:x[5]||'A',confidence:7,marketCondition:'Trending',emotionBefore:'Calm',emotionDuring:'Calm',emotionAfter:r>0?'Confident':'Neutral',ruleAdherence:'Yes',mistake:'None',entryReason:'Clear structure and liquidity confluence',exitReason:'Planned exit',notes:'Demo trade for TradeEdge.'};
}
async function loadDemo(){
  const data=[
    ['XAUUSD','Gold','Long','Liquidity Sweep',2.1,'A+','5m','London'],
    ['EURUSD','Forex','Short','Breakout',-1,'B','15m','New York'],
    ['NAS100','Index CFD','Long','Break & Retest',1.6,'A','5m','London/NY Overlap'],
    ['BTCUSD','Crypto','Long','Momentum',-.8,'B','15m','New York'],
    ['GBPUSD','Forex','Short','Liquidity Sweep',1.4,'A','5m','London'],
    ['XAUUSD','Gold','Long','Reversal',-1,'C','5m','New York'],
    ['US30','Index CFD','Short','Support/Resistance',2.4,'A+','15m','New York'],
    ['ETHUSD','Crypto','Long','Pullback',1.2,'A','15m','Asian'],
    ['EURUSD','Forex','Long','Liquidity Sweep',.9,'A','5m','London'],
    ['XAUUSD','Gold','Short','Break & Retest',-1,'B','5m','London'],
    ['GBPUSD','Forex','Long','Trend Continuation',1.8,'A','1H','London'],
    ['SOLUSD','Crypto','Short','Reversal',-1,'C','15m','New York']
  ];
  for(let i=0;i<data.length;i++)await putTrade(demoTrade(i,data[i]));
  await load();show('dashboard');
}
function formatDate(v){if(!v)return'—';const d=new Date(v);return isNaN(d)?esc(v):d.toLocaleString(undefined,{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
window.show=show;window.editTrade=editTrade;window.deleteTrade=deleteTrade;window.saveForm=saveForm;window.metrics=metrics;window.image=image;window.preview=preview;window.exportJSON=exportJSON;window.exportCSV=exportCSV;window.importJSON=importJSON;window.clearAll=clearAll;window.loadDemo=loadDemo;
window.addEventListener('hashchange',()=>{nav();render(location.hash.slice(1)||'dashboard')});
window.addEventListener('load',async()=>{try{await openDB();await load()}catch(e){console.error(e);$('content').innerHTML='<div class="card"><b>TradeEdge could not open local storage.</b><p class="muted">Please check that browser storage is enabled for this site.</p></div>'}});
</script>
</body>
</html>
