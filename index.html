*{box-sizing:border-box}body{margin:0;background:#0a0d12;color:#e8edf4;font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}.app{display:flex;min-height:100vh}aside{width:240px;position:fixed;inset:0 auto 0 0;background:#0d1118;border-right:1px solid #202732;padding:22px 15px}.brand{display:flex;gap:10px;align-items:center;padding:5px 8px 25px}.logo{width:34px;height:34px;border:1px solid #3a4655;border-radius:9px;display:grid;place-items:center;font-weight:800}.brand b{display:block}.brand small{color:#6f7b8b;font-size:9px}.nav{display:grid;gap:5px}.nav button,.btn{border:1px solid transparent;background:transparent;color:#8c98a8;padding:10px 11px;border-radius:8px;text-align:left;cursor:pointer}.nav button.active,.nav button:hover{background:#171d26;color:#fff}.privacy{position:absolute;bottom:18px;left:15px;right:15px;border:1px solid #232c36;border-radius:9px;padding:11px;color:#7d8998;font-size:10px}.privacy b{color:#c6d0dc;display:block;margin-bottom:4px}main{margin-left:240px;width:calc(100% - 240px);padding:30px 38px;max-width:1450px}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:25px}h1{margin:5px 0 0;font-size:28px;letter-spacing:-.03em}h2{font-size:20px;margin:0 0 7px}.eyebrow{font-size:9px;letter-spacing:.14em;color:#6f7b8b;font-weight:800}.primary{background:#edf1f5!important;color:#0a0d12!important;font-weight:750!important}.grid{display:grid;gap:13px}.stats{grid-template-columns:repeat(6,1fr)}.stat,.card{background:#0f141b;border:1px solid #202833;border-radius:11px}.stat{padding:15px}.stat span,.stat small,.muted{color:#718091;font-size:10px}.stat strong{display:block;font-size:21px;margin-top:8px}.card{padding:17px}.two{grid-template-columns:1fr 1fr;margin-top:13px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.head b{font-size:13px}.chart{height:300px}.chart svg{width:100%;height:220px}.row{display:flex;gap:10px;align-items:center;border-top:1px solid #1b232d;padding:10px 0}.grow{flex:1}.row b{font-size:12px}.row small{display:block;color:#6f7b8b;font-size:9px;margin-top:3px}.dot{width:27px;height:27px;background:#171e27;border-radius:7px;display:grid;place-items:center;font-size:9px}.pos{color:#a9d6bd!important}.neg{color:#dfa6aa!important}.actions{display:flex;gap:7px;justify-content:flex-end}.btn{background:#151c25;border-color:#2a3441;color:#cdd5df}.welcome{margin-top:13px;display:flex;justify-content:space-between;align-items:center}.welcome p{color:#7e8998;max-width:650px;line-height:1.6;font-size:12px}.toolbar{display:flex;gap:8px;margin-bottom:13px}.input,.select,textarea{background:#0d1218;border:1px solid #28323e;color:#dce3ec;border-radius:7px;padding:9px;outline:0}.toolbar .input{flex:1}.table{width:100%;border-collapse:collapse;font-size:11px}.table th{text-align:left;color:#667383;font-size:9px;text-transform:uppercase;padding:11px;background:#0c1117}.table td{padding:11px;border-top:1px solid #1d2530;color:#aab4c1}.pill{font-size:9px;padding:4px 7px;border-radius:20px}.long{background:#123024;color:#9ed2b5}.short{background:#32191b;color:#dda5a8}.form{max-width:1100px}.form h3{color:#8d99a8;font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:25px 0 11px}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{display:grid;gap:5px}.field>span{color:#7f8b9a;font-size:10px}.wide{grid-column:1/-1}.textarea{min-height:75px;width:100%}.metrics{display:flex;gap:15px;flex-wrap:wrap;background:#0b1016;border:1px solid #202a35;border-radius:8px;padding:10px;margin:12px 0}.metrics span{color:#697686;font-size:9px}.metrics b{display:block;color:#d7dfe8;font-size:12px;margin-top:3px}.screens{display:grid;grid-template-columns:1fr 1fr;gap:12px}.screen{min-height:180px;border:1px dashed #34404e;border-radius:9px;display:grid;place-items:center;position:relative;overflow:hidden;color:#758294}.screen label{position:absolute;top:9px;left:11px;font-size:10px}.screen input{position:absolute;inset:0;opacity:0}.screen img{max-width:100%;max-height:260px}.break{display:grid;grid-template-columns:155px 1fr 60px;gap:10px;align-items:center;border-top:1px solid #1b232d;padding:10px 0}.bar{height:4px;background:#1a222c;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:#8798aa}.break small{display:block;color:#697687;font-size:9px;margin-top:3px}.insights{grid-template-columns:repeat(3,1fr)}.setting{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid #1c242e}.setting small{display:block;color:#718092;font-size:10px;margin-top:4px}.danger{color:#dfa6aa!important}.empty{text-align:center;padding:35px;color:#778494}.empty b{display:block;color:#adb7c3;margin-bottom:5px}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center}.modal>div{background:#111720;border:1px solid #2a3441;border-radius:12px;padding:23px;max-width:420px}.modal p{color:#8995a4;font-size:12px;line-height:1.6}@media(max-width:1050px){.stats{grid-template-columns:repeat(3,1fr)}.two,.insights{grid-template-columns:1fr}.formgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){aside{position:static;width:100%;height:auto}.app{display:block}main{margin:0;width:100%;padding:18px}.nav{grid-template-columns:repeat(5,1fr)}.nav button{font-size:0;text-align:center}.nav button:first-letter{font-size:16px}.privacy{display:none}.stats{grid-template-columns:repeat(2,1fr)}.formgrid,.screens{grid-template-columns:1fr}header{align-items:center}.toolbar{flex-wrap:wrap}.toolbar .input{min-width:100%}.table{min-width:800px}.card{overflow:auto}.welcome{display:block}.metrics{gap:10px}}
</style></head><body><div class="app"><aside><div class="brand"><span class="logo">T</span><div><b>TradeEdge</b><small>Track your trades. Find your edge.</small></div></div><div class="nav" id="nav"></div><div class="privacy"><b>Privacy first</b>Your journal stays in this browser. No account or server required.</div></aside><main><header><div><div class="eyebrow">PERSONAL TRADING PERFORMANCE LAB</div><h1 id="title">Dashboard</h1></div><button class="btn primary" onclick="show('add')">＋ Add Trade</button></header><div id="content"></div></main></div><script>
const A=['Forex','Gold','Crypto','Stock CFD','Index CFD'],S=['Liquidity Sweep','Breakout','Break & Retest','Support/Resistance','Trend Continuation','Reversal','Pullback','Momentum','Mean Reversion','Other'],SE=['Asian','London','New York','London/NY Overlap','Other'],E=['Calm','Confident','Excited','Fearful','FOMO','Angry','Hesitant','Revenge','Neutral'],M=['Early entry','Late entry','Oversized position','Moved SL','Removed SL','Chased trade','Revenge trade','Overtrading','Ignored setup','Low-quality setup','Exited early','Held too long','Other'];
let trades=[],filter={asset:'All',strategy:'All',result:'All',q:''},editing=null;const $=x=>document.getElementById(x),id=()=>crypto.randomUUID(),num=x=>Number(x||0);let db;
function open(){return new Promise((r,j)=>{let q=indexedDB.open('tradeedge',1);q.onupgradeneeded=()=>q.result.createObjectStore('trades',{keyPath:'id'});q.onsuccess=()=>{db=q.result;r(db)};q.onerror=()=>j(q.error)})}async function all(){if(!db)await open();return new Promise(r=>{let q=db.transaction('trades').objectStore('trades').getAll();q.onsuccess=()=>r(q.result||[])})}async function put(t){if(!db)await open();return new Promise(r=>{let q=db.transaction('trades','readwrite').objectStore('trades').put(t);q.onsuccess=()=>r()})}async function del(i){db.transaction('trades','readwrite').objectStore('trades').delete(i);setTimeout(load,80)}async function clearAll(){if(confirm('Delete all TradeEdge data from this browser?')){db.transaction('trades','readwrite').objectStore('trades').clear();setTimeout(load,100)}}
function calc(t){let risk=Math.abs(num(t.entry)-num(t.stopLoss))*num(t.positionSize),rr=risk?Math.abs(num(t.takeProfit)-num(t.entry))*num(t.positionSize)/risk:0,p=(num(t.exit)-num(t.entry))*num(t.positionSize)*(t.direction==='Short'?-1:1)-num(t.commission)-num(t.swap)-num(t.fees);return{risk,rr,pnl:p,r:risk?p/risk:0}}
function rows(){return trades.filter(t=>(filter.asset==='All'||t.assetClass===filter.asset)&&(filter.strategy==='All'||t.strategy===filter.strategy)&&(filter.result==='All'||(filter.result==='Win'?calc(t).pnl>0:calc(t).pnl<0))&&((t.instrument+' '+t.strategy+' '+(t.notes||'')).toLowerCase().includes(filter.q.toLowerCase())))}
function stats(ts){let p=0,w=0,l=0,r=0,gw=0,gl=0,e=0,peak=0,dd=0;[...ts].sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{let c=calc(t);p+=c.pnl;r+=c.r;e+=c.pnl;peak=Math.max(peak,e);dd=Math.max(dd,peak-e);if(c.pnl>0){w++;gw+=c.pnl}else if(c.pnl<0){l++;gl-=c.pnl}});return{p,w,l,r,pf:gl?gw/gl:0,avg:ts.length?r/ts.length:0,dd}}
function nav(){let items=[['dashboard','⌂','Dashboard'],['journal','▤','Journal'],['analytics','◈','Analytics'],['insights','✦','Insights'],['settings','⚙','Settings']];$('nav').innerHTML=items.map(x=>`<button class="${location.hash.slice(1)||'dashboard'===x[0]?'active':''}" onclick="show('${x[0]}')">${x[1]} ${x[2]}</button>`).join('')}
function show(p){location.hash=p;nav();$('title').textContent=p[0].toUpperCase()+p.slice(1);editing=null;render(p)}
async function load(){trades=await all();render(location.hash.slice(1)||'dashboard')}
function cardStats(s){return `<div class="grid stats">${[['Total P&L',`$${s.p.toFixed(2)}`,''],['Win Rate',`${s.w+s.l?((100*s.w/(s.w+s.l)).toFixed(1)):0}%`,`${s.w} wins / ${s.l} losses`],['Profit Factor',s.pf.toFixed(2),''],['Expectancy',`${s.avg>=0?'+':''}${s.avg.toFixed(2)}R`,''],['Max Drawdown',`$${s.dd.toFixed(2)}`,''],['Trades',s.w+s.l,'']].map(x=>`<div class="stat"><span>${x[0]}</span><strong class="${x[0]==='Total P&L'?(s.p>=0?'pos':'neg'):''}">${x[1]}</strong><small>${x[2]}</small></div>`).join('')}</div>`}
function render(p){if(p==='dashboard')dashboard();if(p==='journal')journal();if(p==='add')form();if(p==='analytics')analytics();if(p==='insights')insights();if(p==='settings')settings()}
function dashboard(){let ts=rows(),s=stats(ts),eq=0,pts=ts.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>eq+=calc(t).pnl),min=Math.min(0,...pts),max=Math.max(1,...pts),path=pts.length?pts.map((v,i)=>`${i/(pts.length-1||1)*100},${100-(v-min)/(max-min||1)*100}`).join(' '):'';let recent=ts.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);$('content').innerHTML=cardStats(s)+`<div class="grid two"><div class="card chart"><div class="head"><b>Equity Curve</b><span class="muted">Cumulative P&L</span></div>${pts.length?`<svg viewBox="0 0 100 100" preserveAspectRatio="none"><polyline fill="none" stroke="#dce4ed" stroke-width="1.4" points="${path}"/></svg>`:`<div class="empty"><b>Your journal is empty</b>Record your first trade or explore demo data.<br><button class="btn" onclick="demo()">Explore Demo</button></div>`}</div><div class="card"><div class="head"><b>Recent Trades</b><button class="btn" onclick="show('journal')">View all</button></div>${recent.map(tr=>tradeRow(tr)).join('')||'<div class="empty">No trades yet.</div>'}</div></div><div class="card welcome"><div><div class="eyebrow">START HERE</div><h2>Turn your trading history into an edge.</h2><p>Record setup, risk, psychology and outcome. TradeEdge turns your own history into useful statistics.</p></div><div class="actions"><button class="btn" onclick="demo()">Explore Demo</button><button class="btn primary" onclick="show('add')">Record First Trade</button></div></div>`}
function tradeRow(t){let c=calc(t);return `<div class="row"><span class="dot">${t.direction==='Long'?'L':'S'}</span><div class="grow"><b>${t.instrument}</b><small>${t.strategy} · ${t.session}</small></div><b class="${c.pnl>=0?'pos':'neg'}">${c.pnl>=0?'+':''}$${c.pnl.toFixed(2)}</b><span class="${c.r>=0?'pos':'neg'}">${c.r>=0?'+':''}${c.r.toFixed(2)}R</span></div>`}
function journal(){let ts=rows();$('content').innerHTML=`<div class="toolbar"><input class="input" placeholder="Search instrument, strategy, notes..." value="${filter.q}" oninput="filter.q=this.value;journal()"><select class="select" onchange="filter.asset=this.value;journal()"><option>All</option>${A.map(x=>`<option ${filter.asset===x?'selected':''}>${x}</option>`).join('')}</select><select class="select" onchange="filter.strategy=this.value;journal()"><option>All</option>${S.map(x=>`<option ${filter.strategy===x?'selected':''}>${x}</option>`).join('')}</select><select class="select" onchange="filter.result=this.value;journal()"><option>All</option><option ${filter.result==='Win'?'selected':''}>Win</option><option ${filter.result==='Loss'?'selected':''}>Loss</option></select></div><div class="card" style="overflow:auto"><table class="table"><thead><tr><th>Date</th><th>Instrument</th><th>Side</th><th>Strategy</th><th>Session</th><th>R</th><th>P&L</th><th></th></tr></thead><tbody>${ts.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>{let c=calc(t);return `<tr><td>${new Date(t.date).toLocaleString()}</td><td><b>${t.instrument}</b><small>${t.assetClass} · ${t.timeframe}</small></td><td><span class="pill ${t.direction==='Long'?'long':'short'}">${t.direction}</span></td><td>${t.strategy}</td><td>${t.session}</td><td class="${c.r>=0?'pos':'neg'}">${c.r>=0?'+':''}${c.r.toFixed(2)}R</td><td class="${c.pnl>=0?'pos':'neg'}">${c.pnl>=0?'+':''}$${c.pnl.toFixed(2)}</td><td><button class="btn" onclick='edit(${JSON.stringify(t).replaceAll("'","&#39;")})'>Edit</button><button class="btn danger" onclick="del('${t.id}')">Delete</button></td></tr>`}).join('')}</tbody></table>${!ts.length?'<div class="empty"><b>No matching trades</b>Change filters or add a trade.</div>':''}</div>`}
function edit(t){editing=t;show('add')}
function field(k,label,type='text',val='',opts=''){return `<label class="field"><span>${label}</span>${type==='select'?`<select class="select" id="f_${k}">${opts}</select>`:type==='textarea'?`<textarea class="textarea input" id="f_${k}">${val||''}</textarea>`:`<input class="input" id="f_${k}" type="${type}" value="${val??''}">`}</label>`}
function form(){let t=editing||{id:id(),date:new Date().toISOString().slice(0,16),assetClass:'Gold',direction:'Long',account:'Personal',timeframe:'5m',session:'London',strategy:'Liquidity Sweep',setupQuality:'A',confidence:7,marketCondition:'Trending',emotionBefore:'Calm',emotionDuring:'Calm',emotionAfter:'Neutral',ruleAdherence:'Yes',mistake:'None',positionSize:1,contractSize:1};$('content').innerHTML=`<div class="card form"><div class="head"><div><div class="eyebrow">JOURNAL ENTRY</div><h2>${editing?'Edit Trade':'Record Trade'}</h2></div></div><div class="metrics" id="metrics"></div><h3>Trade Information</h3><div class="formgrid">${field('date','Date & time','datetime-local',t.date)}${field('instrument','Instrument','text',t.instrument||'')}${field('assetClass','Asset class','select','',A.map(x=>`<option ${t.assetClass===x?'selected':''}>${x}</option>`).join(''))}${field('direction','Direction','select','',`<option ${t.direction==='Long'?'selected':''}>Long</option><option ${t.direction==='Short'?'selected':''}>Short</option>`)}${field('account','Account','text',t.account||'Personal')}${field('timeframe','Timeframe','text',t.timeframe||'5m')}${field('session','Session','select','',SE.map(x=>`<option ${t.session===x?'selected':''}>${x}</option>`).join(''))}</div><h3>Entry & Exit</h3><div class="formgrid">${field('entry','Entry','number',t.entry)}${field('stopLoss','Stop loss','number',t.stopLoss)}${field('takeProfit','Take profit','number',t.takeProfit)}${field('exit','Exit','number',t.exit)}${field('positionSize','Position size','number',t.positionSize)}${field('contractSize','Contract size','number',t.contractSize||1)}${field('commission','Commission','number',t.commission||0)}${field('swap','Swap','number',t.swap||0)}${field('fees','Other fees','number',t.fees||0)}</div><h3>Setup & Psychology</h3><div class="formgrid">${field('strategy','Strategy','select','',S.map(x=>`<option ${t.strategy===x?'selected':''}>${x}</option>`).join(''))}${field('setupQuality','Setup quality','select','',`<option>A+</option><option ${t.setupQuality==='A'?'selected':''}>A</option><option ${t.setupQuality==='B'?'selected':''}>B</option><option ${t.setupQuality==='C'?'selected':''}>C</option>`)}${field('confidence','Confidence','number',t.confidence||7)}${field('marketCondition','Market condition','select','',`<option>Trending</option><option>Ranging</option><option>Volatile</option><option>Choppy</option>`)}${field('emotionBefore','Emotion before','select','',E.map(x=>`<option ${t.emotionBefore===x?'selected':''}>${x}</option>`).join(''))}${field('emotionDuring','Emotion during','select','',E.map(x=>`<option ${t.emotionDuring===x?'selected':''}>${x}</option>`).join(''))}${field('emotionAfter','Emotion after','select','',E.map(x=>`<option ${t.emotionAfter===x?'selected':''}>${x}</option>`).join(''))}${field('ruleAdherence','Rule adherence','select','',`<option>Yes</option><option>Partially</option><option>No</option>`)}${field('mistake','Mistake','select','',`<option>None</option>${M.map(x=>`<option ${t.mistake===x?'selected':''}>${x}</option>`).join(''))}${field('entryReason','Entry reason','textarea',t.entryReason,'')}</div><div class="formgrid">${field('exitReason','Exit reason','textarea',t.exitReason)}${field('notes','Notes','textarea',t.notes)}</div><h3>Chart Screenshots</h3><div class="screens"><div class="screen" id="beforeBox"><label>Before trade</label><span>＋ Upload chart image</span><input type="file" accept="image/*" onchange="image(this,'beforeBox')"></div><div class="screen" id="afterBox"><label>After trade</label><span>＋ Upload chart image</span><input type="file" accept="image/*" onchange="image(this,'afterBox')"></div></div><div class="actions" style="margin-top:20px"><button class="btn" onclick="show('journal')">Cancel</button><button class="btn primary" onclick="saveForm()">Save Trade</button></div></div>`;window._image={before:t.beforeImage||'',after:t.afterImage||''};if(window._image.before)preview('beforeBox',window._image.before);if(window._image.after)preview('afterBox',window._image.after);['entry','stopLoss','takeProfit','exit','positionSize','commission','swap','fees'].forEach(k=>$('f_'+k).addEventListener('input',metrics));metrics()}
function metrics(){let t={entry:$('f_entry').value,stopLoss:$('f_stopLoss').value,takeProfit:$('f_takeProfit').value,exit:$('f_exit').value,positionSize:$('f_positionSize').value,commission:$('f_commission').value,swap:$('f_swap').value,fees:$('f_fees').value,direction:$('f_direction').value},c=calc(t);$('metrics').innerHTML=`<span>Risk<b>$${c.risk.toFixed(2)}</b></span><span>Planned R:R<b>${c.rr.toFixed(2)}</b></span><span>Actual R<b class="${c.r>=0?'pos':'neg'}">${c.r.toFixed(2)}R</b></span><span>P&L<b class="${c.pnl>=0?'pos':'neg'}">$${c.pnl.toFixed(2)}</b></span>`}
function image(inp,box){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{window._image[box==='beforeBox'?'before':'after']=r.result;preview(box,r.result)};r.readAsDataURL(f)}function preview(box,src){$(box).innerHTML=`<label>${box==='beforeBox'?'Before trade':'After trade'}</label><img src="${src}"><input type="file" accept="image/*" onchange="image(this,'${box}')">`}
async function saveForm(){let t=editing||{id:id()};['date','instrument','assetClass','direction','account','timeframe','session','entry','stopLoss','takeProfit','exit','positionSize','contractSize','commission','swap','fees','strategy','setupQuality','confidence','marketCondition','emotionBefore','emotionDuring','emotionAfter','ruleAdherence','mistake','entryReason','exitReason','notes'].forEach(k=>t[k]=$('f_'+k)?.value??t[k]);t.beforeImage=window._image.before;t.afterImage=window._image.after;await put(t);editing=null;show('journal')}
function group(key){let m={};rows().forEach(t=>{let k=t[key]||'Unknown';m[k]??={n:0,r:0,p:0,w:0};let c=calc(t);m[k].n++;m[k].r+=c.r;m[k].p+=c.pnl;if(c.pnl>0)m[k].w++});return Object.entries(m).sort((a,b)=>b[1].r-a[1].r)}function breakdown(title,data){return `<div class="card"><div class="head"><b>${title}</b><span class="muted">Performance breakdown</span></div>${data.length?data.map(([k,v])=>`<div class="break"><div><b>${k}</b><small>${v.n} trades · ${v.n?(100*v.w/v.n).toFixed(0):0}% win</small></div><div class="bar"><i style="width:${Math.min(100,Math.abs(v.r)*8)}%"></i></div><strong class="${v.r>=0?'pos':'neg'}">${v.r>=0?'+':''}${v.r.toFixed(2)}R</strong></div>`).join(''):'<div class="empty">No data yet.</div>'}</div>`}
function analytics(){$('content').innerHTML=`<div class="grid two">${breakdown('By Strategy',group('strategy'))}${breakdown('By Instrument',group('instrument'))}</div><div class="grid two">${breakdown('By Session',group('session'))}${breakdown('By Timeframe',group('timeframe'))}</div><div class="grid two">${breakdown('By Direction',group('direction'))}${breakdown('By Setup Quality',group('setupQuality'))}</div>`}
function insights(){let s=group('strategy'),m=group('mistake').filter(x=>x[0]!=='None'),e=group('emotionBefore');$('content').innerHTML=`<div class="grid insights"><div class="card"><b>✦ Your edge</b><p class="muted">${s[0]?`${s[0][0]} is your strongest setup at ${s[0][1].r.toFixed(2)}R across ${s[0][1].n} trades.`:'Add more trades to discover your strongest setup.'}</p></div><div class="card"><b>⚠ Performance leak</b><p class="muted">${m.length?`${m.sort((a,b)=>a[1].r-b[1].r)[0][0]} is associated with ${m.sort((a,b)=>a[1].r-b[1].r)[0][1].r.toFixed(2)}R. Review these trades.`:'No recurring mistake detected yet.'}</p></div><div class="card"><b>◉ Psychology</b><p class="muted">${e.length?`${e.sort((a,b)=>b[1].r-a[1].r)[0][0]} trades currently have the strongest result.`:'Record emotions to unlock behavioral insights.'}</p></div></div><div class="card" style="margin-top:13px"><b>Methodology</b><p class="muted">TradeEdge insights are descriptive statistics from your own journal. They are not predictions or financial advice.</p></div>`}
function settings(){$('content').innerHTML=`<div class="grid two"><div class="card"><div class="head"><b>Backup & Export</b><span class="muted">Local-first</span></div><div class="setting"><div><b>JSON backup</b><small>Full journal including screenshots.</small></div><button class="btn" onclick="exportJSON()">Export JSON</button></div><div class="setting"><div><b>CSV export</b><small>Trade data for spreadsheets.</small></div><button class="btn" onclick="exportCSV()">Export CSV</button></div><div class="setting"><div><b>Import JSON</b><small>Restore a TradeEdge backup.</small></div><input type="file" accept="application/json" onchange="importJSON(this)"></div></div><div class="card"><div class="head"><b>Privacy</b></div><p class="muted" style="line-height:1.7">TradeEdge has no login, backend or central database. Your data stays in this browser's IndexedDB. Export backups before clearing browser/site data.</p><button class="btn danger" onclick="clearAll()">Delete all local data</button></div></div>`}
function dl(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function exportJSON(){dl(new Blob([JSON.stringify({app:'TradeEdge',version:1,trades},null,2)],{type:'application/json'}),'tradeedge-backup.json')}function exportCSV(){let h=['date','instrument','assetClass','direction','strategy','timeframe','session','entry','stopLoss','takeProfit','exit','positionSize','commission','swap','fees','setupQuality','confidence','emotionBefore','emotionDuring','emotionAfter','ruleAdherence','mistake','notes'];let out=[h.join(','),...trades.map(t=>h.map(k=>'"'+String(t[k]??'').replaceAll('"','""')+'"').join(','))];dl(new Blob([out.join('\n')],{type:'text/csv'}),'tradeedge-trades.csv')}function importJSON(inp){let r=new FileReader();r.onload=async()=>{try{let d=JSON.parse(r.result);for(let t of d.trades||[])await put(t);await load();alert('Backup imported.')}catch(e){alert('Invalid TradeEdge JSON backup.')}};r.readAsText(inp.files[0])}
async function demo(){let now=Date.now(),data=[['XAUUSD','Gold','Long','Liquidity Sweep',2.1,105,'London'],['EURUSD','Forex','Short','Breakout',-1,-50,'New York'],['NAS100','Index CFD','Long','Break & Retest',1.6,80,'London/NY Overlap'],['BTCUSD','Crypto','Long','Momentum',-.8,-40,'New York'],['GBPUSD','Forex','Short','Liquidity Sweep',1.4,70,'London'],['XAUUSD','Gold','Long','Reversal',-1,-50,'New York'],['US30','Index CFD','Short','Support/Resistance',2.4,120,'New York'],['ETHUSD','Crypto','Long','Pullback',1.2,60,'Asian'],['EURUSD','Forex','Long','Liquidity Sweep',.9,45,'London'],['XAUUSD','Gold','Short','Break & Retest',-1,-50,'London']];for(let [i,x] of data.entries())await put({id:id(),date:new Date(now-i*86400000).toISOString().slice(0,16),instrument:x[0],assetClass:x[1],direction:x[2],strategy:x[3],timeframe:'5m',session:x[6],entry:100,stopLoss:x[2]==='Long'?99:101,takeProfit:x[2]==='Long'?102:98,exit:x[2]==='Long'?100+x[4]*.5:100-x[4]*.5,positionSize:1,commission:0,swap:0,fees:0,setupQuality:i%3===0?'A+':i%3===1?'A':'B',confidence:7,entryReason:'Clear structure and liquidity confluence',exitReason:'Planned exit',marketCondition:'Trending',emotionBefore:'Calm',emotionDuring:'Calm',emotionAfter:x[4]>0?'Confident':'Neutral',ruleAdherence:'Yes',mistake:'None',notes:'Demo trade for TradeEdge.'});await load();show('dashboard')}
window.show=show;window.edit=edit;window.del=del;window.demo=demo;window.saveForm=saveForm;window.metrics=metrics;window.image=image;window.preview=preview;window.exportJSON=exportJSON;window.exportCSV=exportCSV;window.importJSON=importJSON;window.clearAll=clearAll;window.onload=async()=>{await open();await load();nav()};window.onhashchange=()=>{nav();render(location.hash.slice(1)||'dashboard')};
</script></body></html>
